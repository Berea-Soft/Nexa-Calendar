name: Release & Publish to NPM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build all packages
        run: pnpm -r build

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure NPM
        run: |
          npm config set '@bereasoftware:registry' 'https://registry.npmjs.org/'
          npm config set '//registry.npmjs.org/:_authToken' "${{ secrets.NPM_TOKEN }}"

      - name: Build all packages
        run: pnpm -r build

      - name: Get next version
        id: version
        run: |
          git fetch --tags
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          MAJOR=$((MAJOR))
          MINOR=$((MINOR + 1))
          PATCH=0
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Last tag: $LAST_TAG"
          echo "New version: $NEW_VERSION"

      - name: Update versions
        run: |
          for pkg in packages/core packages/ui packages/react packages/vue packages/angular packages/svelte; do
            cd $pkg
            npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
            cd ../..
          done

      - name: Publish core to NPM
        working-directory: packages/core
        run: npm publish --access public

      - name: Publish UI to NPM
        working-directory: packages/ui
        run: npm publish --access public

      - name: Publish React to NPM
        working-directory: packages/react
        run: npm publish --access public

      - name: Publish Vue to NPM
        working-directory: packages/vue
        run: npm publish --access public

      - name: Publish Angular to NPM
        working-directory: packages/angular
        run: npm publish --access public

      - name: Publish Svelte to NPM
        working-directory: packages/svelte
        run: npm publish --access public

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v${{ steps.version.outputs.VERSION }}"
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push origin main --tags
